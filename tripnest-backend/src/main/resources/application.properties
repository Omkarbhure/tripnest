spring.application.name=tripnest-backend
server.port=${PORT:8081}

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/tripnest}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:root}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Schema Initialization
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# JWT Configuration
jwt.secret=${JWT_SECRET:tripnest_super_secret_jwt_key_2026_spring_boot_app_secure_token}
jwt.expiration=86400000

# OpenWeather API
openweather.api.key=${OPENWEATHER_API_KEY:}
openweather.api.url=https://api.openweathermap.org/data/2.5/weather

# OpenStreetMap / Nominatim API
nominatim.api.url=https://nominatim.openstreetmap.org/search

# File Upload Configuration
app.upload-dir=uploads
app.photo-base-url=${APP_PHOTO_BASE_URL:http://localhost:8081/uploads}

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
